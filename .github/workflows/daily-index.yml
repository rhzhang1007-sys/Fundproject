name: Daily resolved index observations
on:
  schedule:
    # 05:20 Asia/Shanghai. Only previously resolved symbols; no full discovery.
    - cron: '20 21 * * *'
    - cron: '21 23,1,3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily NAV and deterministic factors']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: daily-resolved-indices
  queue: max
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check today's execution marker
        id: daily
        run: node prototype/daily-runtime.mjs check index >> "$GITHUB_OUTPUT"
      - run: python prototype/scripts/update_resolved_indices.py --workers 3 --budget-minutes 15
        if: steps.daily.outputs.run == 'true'
      - run: node prototype/daily-runtime.mjs mark index
        if: steps.daily.outputs.run == 'true'
      - name: Save observations
        if: steps.daily.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/dist/data/v13/index-daily.json prototype/dist/data/v13/index-status.json
          git add prototype/dist/data/v14/runtime/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update resolved index price observations'
          git -c rebase.autoStash=true pull --rebase
          git push

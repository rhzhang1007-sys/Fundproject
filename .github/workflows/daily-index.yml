name: Daily resolved index observations
on:
  schedule:
    # 08:40 Asia/Shanghai. Only previously resolved symbols; no full discovery.
    - cron: '40 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-resolved-indices
  queue: max
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python prototype/scripts/update_resolved_indices.py --workers 3 --budget-minutes 15
      - name: Save observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/dist/data/v13/index-daily.json prototype/dist/data/v13/index-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update resolved index price observations'
          git -c rebase.autoStash=true pull --rebase
          git push

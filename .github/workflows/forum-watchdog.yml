name: Check forum collector heartbeat
on:
  schedule:
    - cron: '18,48 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Continue global forum queue']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: forum-collector-watchdog
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wake overdue NAV, index and news jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/daily_dispatch.py
      - name: Resume an overdue collector when no run is active
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/forum_watchdog.py

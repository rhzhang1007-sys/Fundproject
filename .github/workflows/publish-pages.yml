name: Publish portfolio website
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily public data']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.config.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          cfg=json.load(open('prototype/config/public-updates.json'))
          print('publish=' + ('true' if cfg.get('publishEnabled') is True else 'false'))
          EOF
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application and prepare public-only directory
        run: |
          node --test prototype/tests/v08-model.test.mjs prototype/tests/v08-ai.test.mjs prototype/tests/v09-industry.test.mjs
          python prototype/scripts/prepare_v08_public_site.py --destination tmp/public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

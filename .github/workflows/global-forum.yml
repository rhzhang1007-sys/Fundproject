name: Continue global forum queue
on:
  schedule:
    # Continue every 20 minutes; 05:05 China time rolls to the new target; overnight batches finish prior work.
    - cron: '5,25,45 * * * *'
  workflow_dispatch:
    inputs:
      verify_checkpoint_only:
        description: 'Only verify the saved corpus can resume; no collection or model calls'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['prototype/config/global-forum-bootstrap.json']
permissions:
  contents: read
concurrency:
  group: global-public-forum-collection
  queue: max
  cancel-in-progress: false
jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check global scope offline
        run: python prototype/scripts/global_forum.py
      - name: Read queue switch
        id: gate
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json,sys
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'prototype/scripts')
          from forum_schedule import collection_day,batch_allowed
          c=json.load(open('prototype/config/public-updates.json'))
          p=Path('prototype/dist/data/v10/forum-state.json');state=json.loads(p.read_text()) if p.exists() else {}
          allowed,reason=batch_allowed(state,c.get('forumDaily',{}),collection_day(c.get('forumDaily',{})),datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          enabled=c.get('enabled') is True and c.get('forumDaily',{}).get('enabled') is True
          print('enabled='+str(enabled and (allowed or '${{ inputs.verify_checkpoint_only }}'=='true')).lower())
          print('reason='+reason)
          PYTHON
      - name: Wake overdue NAV, index and news jobs
        if: success() && inputs.verify_checkpoint_only != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/daily_dispatch.py
      - name: Restore private resumable corpus
        id: corpus_restore
        if: steps.gate.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/github_corpus_cache.py pull
      - name: Resume yesterday posts and comments without model calls
        if: steps.gate.outputs.enabled == 'true' && inputs.verify_checkpoint_only != true
        run: python prototype/scripts/global_forum.py --collect
      - name: Audit actual coverage and report partial collection
        if: always() && steps.corpus_restore.outcome == 'success' && inputs.verify_checkpoint_only != true
        run: |
          python - <<'PYTHON'
          import os
          import forum_quality
          # The regular collector already saved its rotating retry plan.
          r=forum_quality.audit(queue=False)
          text=(f"### Forum coverage: {r['targetDay']}\n"
                f"Status: **{r['status']}**; list windows {r['listWindowsComplete']}/{r['scope']}.\n\n"
                f"Selected posts: {r['selectedPosts']}; complete readable bodies: {r['readableCompleteBodies']}; acquired comments: {r['acquiredComments']}.\n\n"
                f"Sample complete: {r['sampleComplete']}/{len(r['sample'])}; retry tasks: {r['retryQueueSize']}; integrity errors: {r['integrityErrorCount']}.\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          if r['status']!='ready':print('::warning::Forum content is partial or delayed; successful execution does not mean complete coverage.')
          raise SystemExit(2 if r['integrityErrorCount'] else 0)
          PYTHON
        env:
          PYTHONPATH: prototype/scripts
      - name: Verify restored cursor matches corpus
        if: inputs.verify_checkpoint_only == true
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          p=Path('prototype/dist/data/v10')
          pointer=json.loads((p/'corpus-pointer.json').read_text())
          marker=json.loads(Path('prototype/.public-corpus/checkpoint.json').read_text())
          assert pointer['sha256']==marker['sha256']
          files=list(Path('prototype/.public-corpus/activity').glob('*/*.json'))
          objects={k for f in files for k in json.loads(f.read_text())['objects']}
          state=json.loads((p/'forum-state.json').read_text())
          completed=[k for k,v in state['objects'].items() if v.get('throughDay')]
          assert all(k in objects for k in completed),'Cursor is ahead of restored material'
          print(json.dumps(dict(status='restore-and-cursor-verified',files=len(files),objects=len(objects),completedObjects=len(completed),collectionUsed=False,modelUsed=False)))
          PYTHON
      - name: Save and verify private corpus checkpoint
        id: corpus_save
        if: always() && steps.corpus_restore.outcome == 'success' && inputs.verify_checkpoint_only != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/github_corpus_cache.py push
      - name: Persist checkpoints and cumulative budget
        if: always() && steps.gate.outputs.enabled == 'true' && inputs.verify_checkpoint_only != true
        env:
          CORPUS_SAVED: ${{ steps.corpus_save.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PYTHON'
          import os,subprocess
          from pathlib import Path
          paths=['prototype/dist/data/v08/llm-usage.json']
          if os.environ.get('CORPUS_SAVED')=='success':paths+=['prototype/dist/data/v10','prototype/dist/data/v08/forum.json','prototype/dist/data/v11/forum-seed.json','prototype/dist/data/v12/posts']
          else:paths+=['prototype/dist/data/v10/forum-batch-status.json']
          paths=[p for p in paths if Path(p).exists()]
          if paths:subprocess.run(['git','add','--',*paths],check=True)
          PYTHON
          if test -d prototype/dist/data/v08/llm-usage; then git add prototype/dist/data/v08/llm-usage; fi
          if test -f prototype/dist/data/v08/llm-cache.json; then git add prototype/dist/data/v08/llm-cache.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Continue full-directory forum queue and public activity'
          python prototype/scripts/git_publish_retry.py
      - name: Continue a productive partial batch
        if: success() && steps.gate.outputs.enabled == 'true' && inputs.verify_checkpoint_only != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python prototype/scripts/forum_continue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-forum-coverage
          path: |
            prototype/dist/data/v10/coverage.json
            prototype/dist/data/v10/forum-batch-status.json
            prototype/dist/data/v10/forum-health.json
            prototype/dist/data/v08/llm-usage.json
          if-no-files-found: ignore
          retention-days: 7

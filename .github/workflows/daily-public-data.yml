name: Daily public data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'prototype/scripts/**'
      - 'prototype/**/*.mjs'
      - 'prototype/**/*.css'
      - 'prototype/dist/index.html'
      - 'prototype/serve.py'
      - 'prototype/tests/**'
      - 'prototype/config/**'
      - 'prototype/requirements-daily.txt'
  schedule:
    # 08:50 Asia/Shanghai; GitHub scheduling can be delayed.
    - cron: '50 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-public-data-${{ github.event_name == 'push' && 'validation' || 'collection' }}
  queue: max
  cancel-in-progress: false
jobs:
  update:
    name: ${{ github.event_name == 'push' && 'Validate public data code' || 'Collect public data' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must see the latest committed daily budget, not an old push SHA.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install daily reader dependency
        run: python -m pip install -r prototype/requirements-daily.txt
      - name: Validate deterministic pipeline
        run: |
          python -m unittest discover -s prototype/tests -p 'test_public_updates*.py'
          python -m unittest discover -s prototype/tests -p 'test_news_pipeline.py'
          python -m unittest discover -s prototype/tests -p 'test_global_*.py'
          python -m unittest discover -s prototype/tests -p 'test_overnight_import.py'
          python -m unittest discover -s prototype/tests -p 'test_daily_factors.py'
          python -m unittest discover -s prototype/tests -p 'test_index_observations.py'
          python -m unittest discover -s prototype/tests -p 'test_forum_sources.py'
      - name: Validate website data interfaces
        run: node --test prototype/tests/v08-model.test.mjs prototype/tests/v08-ai.test.mjs prototype/tests/v09-industry.test.mjs prototype/tests/v09-public-data.test.mjs prototype/tests/v10-objects.test.mjs prototype/tests/v11-integration.test.mjs prototype/tests/web-ai-server.test.mjs prototype/tests/v13-analysis.test.mjs
      - name: Check runtime configuration without collecting
        run: python prototype/scripts/daily_pipeline.py
      - name: Read collection switch
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          config=json.load(open('prototype/config/public-updates.json'))
          print('enabled='+('true' if config.get('enabled') is True else 'false'))
          PY
      - name: Daily public news and market facts
        id: collect
        if: github.event_name != 'push' && steps.gate.outputs.enabled == 'true'
        run: python prototype/scripts/daily_pipeline.py --collect --news-only
      - name: Persist validated news, market facts and status
        if: always() && github.event_name != 'push' && steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          status=Path('prototype/dist/data/v09/update-status.json')
          ready=json.loads(status.read_text()) if status.exists() else {}
          paths=['prototype/dist/data/v09/update-status.json']
          if ready.get('newsReady'): paths+=['prototype/dist/data/v07/events.json','prototype/dist/data/archive','prototype/dist/data/v12/news','prototype/dist/data/v12/news-shard-status.json']
          if ready.get('marketReady'): paths+=['prototype/dist/data/v09/market-daily.json','prototype/dist/data/v09/market-history']
          existing=[p for p in paths if Path(p).exists()]
          if existing:subprocess.run(['git','add','--',*existing],check=True)
          if Path('prototype/dist/data/archive').exists():subprocess.run(['git','add','-A','--','prototype/dist/data/archive'],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public news and dated market observations'
          git -c rebase.autoStash=true pull --rebase
          git push
      - name: Save readable run report
        if: always() && github.event_name != 'push' && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-data-status
          path: |
            prototype/dist/data/v09/update-status.json
          if-no-files-found: ignore
          retention-days: 14

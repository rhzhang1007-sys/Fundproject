name: Daily NAV and deterministic factors
on:
  schedule:
    # 08:35 Asia/Shanghai. Own data paths and writer lock; scheduling may delay.
    - cron: '35 0 * * *'
  workflow_dispatch:
    inputs:
      fill_minutes:
        description: 'Maximum minutes for single-fund fallback (20 for daily collection)'
        type: number
        default: 20
permissions:
  contents: read
concurrency:
  group: daily-nav-collection
  queue: max
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate formulas and daily NAV adapter
        run: python -m unittest discover -s prototype/tests -p 'test_daily_factors.py'
      - name: Collect source NAV, update frontend, compute eligible factors
        env:
          FILL_MINUTES: ${{ inputs.fill_minutes || '20' }}
        run: |
          python prototype/scripts/collect_nav_snapshot.py --size 1000 --max-pages 60 --sleep 1 --fill-limit 9000 --fill-minutes "$FILL_MINUTES"
          python prototype/scripts/sync_nav_observations.py
          python prototype/scripts/update_market_observations.py
          python prototype/scripts/compute_daily_factors.py
      - name: Commit validated daily observations and factors
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/dist/data/v12/nav prototype/dist/data/v12/factors prototype/dist/data/v12/factor-status.json prototype/dist/data/v12/nav-sync-status.json prototype/dist/data/v12/market-sync-status.json prototype/dist/data/v11/observations prototype/dist/data/v11/market.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily NAV observations and eligible v2 factors'
          git -c rebase.autoStash=true pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-factor-status
          path: |
            prototype/dist/data/v12/*status.json
            prototype/dist/data/v12/nav/last-failed-attempt.json
          if-no-files-found: ignore
          retention-days: 14

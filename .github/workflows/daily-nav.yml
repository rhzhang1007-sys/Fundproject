name: Daily NAV and deterministic factors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-nav.yml'
      - 'prototype/scripts/collect_nav_snapshot.py'
  schedule:
    # 05:10 Asia/Shanghai. Also woken by active collector/heartbeat if overdue.
    # Bulk NAV only, no per-fund daily backfill.
    - cron: '10 21 * * *'
    - cron: '11 23,1,3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-nav-collection
  queue: max
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check today's execution marker
        id: daily
        run: node prototype/daily-runtime.mjs check nav >> "$GITHUB_OUTPUT"
      - name: Validate formulas and daily NAV adapter
        run: python -m unittest discover -s prototype/tests -p 'test_daily_factors.py'
      - name: Collect source NAV, update frontend, compute eligible factors
        if: steps.daily.outputs.run == 'true'
        run: |
          python prototype/scripts/collect_nav_snapshot.py --size 50000 --max-pages 60 --sleep 1
          python prototype/scripts/sync_nav_observations.py
          python prototype/scripts/update_market_observations.py
          python prototype/scripts/compute_daily_factors.py
          node prototype/build-analysis-view.mjs
          node prototype/daily-runtime.mjs mark nav
      - name: Keep research catalogue on the same analytical version
        id: research
        run: |
          node --input-type=module - <<'JS'
          import {readFile,appendFile} from 'node:fs/promises';
          import {buildResearch} from './prototype/build-research-view.mjs';
          import {RESEARCH_METHOD} from './prototype/dist/v16-compute.mjs';
          const base='prototype/dist/data/';
          const input=JSON.parse(await readFile(base+'v14/manifest.json'));
          let current;try{current=JSON.parse(await readFile(base+'v16/manifest.json'));}catch{}
          const rebuild=current?.sourceVersion!==input.version||current?.method!==RESEARCH_METHOD;
          if(rebuild)console.log(JSON.stringify(await buildResearch()));
          await appendFile(process.env.GITHUB_OUTPUT,'rebuilt='+rebuild+'\n');
          JS
      - name: Validate matching research data before committing
        run: node --test prototype/tests/v16-research.test.mjs
      - name: Commit validated daily observations and factors
        if: success() && (steps.daily.outputs.run == 'true' || steps.research.outputs.rebuilt == 'true')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/dist/data/v12/nav prototype/dist/data/v12/factors prototype/dist/data/v12/factor-status.json prototype/dist/data/v12/nav-sync-status.json prototype/dist/data/v12/market-sync-status.json prototype/dist/data/v11/observations prototype/dist/data/v11/market.json
          git add prototype/dist/data/v14 prototype/dist/data/v16
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily NAV observations and eligible factors'
          git -c rebase.autoStash=true pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-factor-status
          path: |
            prototype/dist/data/v12/*status.json
            prototype/dist/data/v12/nav/last-failed-attempt.json
          if-no-files-found: ignore
          retention-days: 14
